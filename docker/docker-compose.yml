services:
  api:
    build: ./api
    ports:
      - "9000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - db
      - redis
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: fastapi
    ports:
      - "33066:3306"
    volumes:
      - local_db:/var/lib/mysql
  worker:
    build: ./worker
    volumes:
      - ./worker:/app
    depends_on:
      - redis
  redis:
    image: redis:8

volumes:
  local_db:
